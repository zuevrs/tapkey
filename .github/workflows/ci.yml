name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux from the first commit: portability that is not compiled has already
        # rotted (ADR-0016). macOS is the first shipping target.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Scoped to the core: the app is a Tauri crate whose Linux build wants webkit system
      # libraries the engine has no use for. The app has its own job.
      - name: Clippy
        run: cargo clippy -p tapkey-core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tapkey-core --all-targets

      - name: Doc tests
        run: cargo test -p tapkey-core --doc

  app:
    name: app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version '^2' || true

      # The smoke build per ADR-0016: the bundle exists. The backend is already covered by the
      # core's tests, and launching a GUI in CI is flake that would only re-prove them.
      - name: Clippy
        run: cargo clippy -p tapkey-app --all-targets -- -D warnings

      - name: Build the bundle
        run: cargo tauri build

  windows:
    name: windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Tests, not just a check: the seam is now implemented, and the tests are the measurement
      # the seam ticket said Windows deserved. A check alone would let a lying stub stay green.
      - name: Test
        run: cargo test -p tapkey-core --all-targets

  msrv:
    name: oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-version` in Cargo.toml is a promise cargo enforces on whoever depends on this
      # crate, and until this job existed nothing here ever compiled against it — the same
      # shape as a fixture that passes locally while not being in the repository at all.
      - name: Install the declared minimum
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Build and test only: clippy and rustfmt move faster than the language, and holding an
      # old toolchain to a new lint would fail for a reason that is not about portability.
      - name: Build
        run: cargo build -p tapkey-core --all-targets

      - name: Test
        run: cargo test -p tapkey-core --all-targets

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No internal material in the tree
        # internal/, CLAUDE.md and .scratch/ are local-only working material. If one is
        # ever committed it must fail loudly here rather than be noticed by a reader.
        run: |
          fail=0
          for path in internal CLAUDE.md .scratch .claude; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked and must not be"
              fail=1
            fi
          done
          exit $fail
