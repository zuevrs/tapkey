name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux from the first commit: portability that is not compiled has already
        # rotted (ADR-0016). macOS is the first shipping target.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

  windows:
    name: windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Check, not test: the Windows seam is decided but not built, and this job exists so the
      # platform stays compiled — portability that is not compiled has already rotted (ADR-0016).
      # It landed before any Windows-specific implementation, as the seam ticket required.
      - name: Check
        run: cargo check --workspace --all-targets

  msrv:
    name: oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-version` in Cargo.toml is a promise cargo enforces on whoever depends on this
      # crate, and until this job existed nothing here ever compiled against it — the same
      # shape as a fixture that passes locally while not being in the repository at all.
      - name: Install the declared minimum
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Build and test only: clippy and rustfmt move faster than the language, and holding an
      # old toolchain to a new lint would fail for a reason that is not about portability.
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No internal material in the tree
        # internal/, CLAUDE.md and .scratch/ are local-only working material. If one is
        # ever committed it must fail loudly here rather than be noticed by a reader.
        run: |
          fail=0
          for path in internal CLAUDE.md .scratch .claude; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked and must not be"
              fail=1
            fi
          done
          exit $fail
