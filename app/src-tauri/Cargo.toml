[package]
name = "tapkey-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The bridge: a direct path dependency and one command. ADR-0016's "static library, no C ABI"
# was written for a Swift UI; Tauri's backend is Rust, so the ABI question never arises and the
# decision — one call, no second implementation — is kept more cheaply than promised.
tapkey-core = { path = "../../core" }

tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde_json = "1"
url = "2"

# The shell, as decided in A2.
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"


# For the vibrancy material behind the panel and HUD: NSVisualEffectView is a view inserted
# below the webview — no window-class swap, which the live pass measured as display-only.
[target.'cfg(target_os = "macos")'.dependencies]
# The vibrancy material behind the floating surfaces, by the tauri author's own crate —
# the hand-rolled objc insertion crashed on addSubview's ABI and this exists to be that.
window-vibrancy = "0.5"

[lib]
name = "tapkey_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# objc 0.2's macros expand to a `cfg(cargo-clippy)` guard that is theirs, not ours; the
# panel's key-window path is the only user, and the alternative is editing a git dependency.
unexpected_cfgs = "allow"
