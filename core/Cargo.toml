[package]
name = "tapkey-core"
version = "0.0.0"
description = "The tapkey engine: profiles, adapters, splicers, atomic writes."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

build = "build.rs"

[lib]
name = "tapkey_core"

[dependencies]
# The wire envelope only. Files belonging to the tools are read and spliced by `json`,
# never by serde: serde would reorder and reformat what ADR-0010 requires be preserved.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# For `flock`, and on Darwin for `fcntl(fd, F_FULLFSYNC)`: there a plain `fsync` returns once the
# data reaches the drive's cache rather than the platter, and the standard library offers no way
# to ask for more.
libc = "0.2"
